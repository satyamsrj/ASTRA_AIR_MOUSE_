common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/imu/data"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    lidar_type: 2                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 32
    scan_rate: 10                # only need to be set for velodyne, unit: Hz,
    timestamp_unit: 2            # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
    # blind was 2 (metres; preprocess.cpp compares squared range against blind*blind). Every
    # LiDAR return within 2 m of the sensor was discarded before FAST-LIO ever saw it. In a 15x15 m
    # arena with interior rooms the vehicle is routinely within 2 m of several walls at once, so in
    # tight spots essentially the whole scan was thrown away and scan matching had nothing left to
    # register against. Measured on run 10_50_06: at t=153.9 s FAST-LIO logged repeated
    # "No Effective Points!" while the vehicle sat 0.20 m from a wall with 187 wall cells inside
    # the 2 m blind radius; the pose then propagated on IMU alone, drifted ~8 m, and because
    # relay_odometry.py feeds that pose to PX4 as /mavros/vision_pose/pose (EKF2_EV_CTRL=11),
    # EKF2 diverged with it -- groundtruth had the vehicle hovering at 1.0 m while EKF2 reported
    # 14.6 m/s and -2.3 m altitude. That is the "drone ends up stuck at the wall" failure.
    # 0.5 m still rejects self-returns: the VLP-16 sits 0.12 m above base_link, the rotors are
    # ~0.1 m below it at ~0.26 m radius with ~0.13 m props, so the lowest -15deg beam can clip a
    # prop tip out to ~0.38 m. The Gazebo sensor itself reports from <min>0.1</min>.
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic,
    extrinsic_T: [ 0, 0, 0.28]
    extrinsic_R: [ 1, 0, 0, 
                   0, 1, 0, 
                   0, 0, 1]

publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    # was true. With interval -1 this keeps EVERY scan of the whole flight in RAM (the comment
    # below is upstream's own warning). Measured cost: a run reached 12 GB of 14 GB plus 4 GB of
    # swap and was then OOM-killed at t=482 s -- "Killed" on all three roslaunch processes, which
    # is how essentially every unattended run has been ending. The PCD is only written at clean
    # shutdown, so an OOM-killed run pays the entire memory cost and produces no file at all:
    # catkin_ws/src/FAST_LIO/PCD/ contains nothing from any run. Re-enable only for a short run
    # that is stopped deliberately.
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
